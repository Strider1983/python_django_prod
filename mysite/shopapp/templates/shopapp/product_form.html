{% extends 'shopapp/base.html' %}

{% block title %}
    Create Product
{% endblock %}

{% block body %}
    <h1>Create a new product</h1>
    <div>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">
            CREATE
        </button>
    </form>
    </div>
    <div>
    <a href="{% url 'shopapp:product_list' %}">
        Return to list of products
    </a>
    </div>
{% endblock %}
