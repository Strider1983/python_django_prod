{% extends 'shopapp/base.html' %}

{% block title %}
    Update product #{{ product.pk }}
{% endblock %}

{% block body %}
    <h1>Update product</h1>
    <div>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">
            UPDATE
        </button>
    </form>
    </div>
    <div>
    <a href="{% url 'shopapp:product_detail' pk=product.pk%}">
        Return to product detail
    </a>
    </div>
{% endblock %}
